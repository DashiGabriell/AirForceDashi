<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFD · PLAY button preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e0e10;
        color: #f5f5f7;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        gap: 28px;
      }
      .stage {
        width: min(720px, 92vw);
        padding: 40px 28px;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(209, 30, 36, 0.12), transparent 55%),
          #141416;
        border: 1px solid #3a3a3e;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      p {
        margin: 0;
        opacity: 0.5;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="./PLAY.svg" alt="Play button" />
    </div>
    <p>Asset preview · reestilo/PLAY.svg · not wired to game</p>
  </body>
</html>
