<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFD · Main Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css?v=9" />
    <link rel="stylesheet" href="./telas.css?v=3" />
    <style>
      /* —— Fase 1: header hub (só esta página) —— */
      .tela--menu-v2 .menu-top {
        display: none;
      }

      .afd-header {
        --cut: 12px;
        --afd-cut: polygon(
          0 0,
          100% 0,
          100% calc(100% - var(--cut)),
          calc(100% - var(--cut)) 100%,
          0 100%
        );
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 16px 22px 0;
        padding: 12px 16px;
        border: 1px solid transparent;
        clip-path: var(--afd-cut);
      }

      /* Skin A — Glass (default): leve, deixa o fundo respirar */
      .afd-header[data-skin="glass"] {
        background: rgba(245, 245, 247, 0.06);
        border-color: rgba(245, 245, 247, 0.22);
        backdrop-filter: blur(14px) saturate(1.15);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 10px 28px rgba(0, 0, 0, 0.22);
      }

      /* Skin B — Steel: sem fill, só estrutura / filete */
      .afd-header[data-skin="steel"] {
        background: transparent;
        border-color: transparent;
        backdrop-filter: none;
        box-shadow: none;
      }

      .afd-header[data-skin="steel"]::after {
        content: "";
        position: absolute;
        left: 0;
        right: var(--cut);
        bottom: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(209, 30, 36, 0.9),
          rgba(245, 245, 247, 0.35) 40%,
          transparent
        );
        pointer-events: none;
      }

      /* Skin C — Veil: wash claro sobre a paisagem */
      .afd-header[data-skin="veil"] {
        background: linear-gradient(
          180deg,
          rgba(245, 245, 247, 0.12),
          rgba(245, 245, 247, 0.04)
        );
        border-color: rgba(245, 245, 247, 0.18);
        backdrop-filter: blur(8px);
        box-shadow: inset 0 0 0 1px rgba(209, 30, 36, 0.18);
      }

      .afd-header__bracket {
        position: absolute;
        width: 14px;
        height: 14px;
        pointer-events: none;
        border-color: rgba(245, 245, 247, 0.75);
        border-style: solid;
        opacity: 0.8;
      }

      .afd-header__bracket--tl {
        top: 0;
        left: 0;
        border-width: 2px 0 0 2px;
      }

      .afd-header__bracket--tr {
        top: 0;
        right: 0;
        border-width: 2px 2px 0 0;
      }

      .afd-header__bracket--bl {
        bottom: 0;
        left: 0;
        border-width: 0 0 2px 2px;
      }

      .afd-header__bracket--br {
        right: 0;
        bottom: 0;
        width: calc(var(--cut) + 2px);
        height: calc(var(--cut) + 2px);
        border-width: 0 2px 2px 0;
        transform: translate(1px, 1px);
        clip-path: polygon(40% 0, 100% 0, 100% 100%, 0 100%, 0 40%);
      }

      .afd-header__left,
      .afd-header__right {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .afd-header__right {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .afd-pilot {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 2px 4px 2px 2px;
        text-align: left;
      }

      .afd-pilot:hover .afd-pilot__name {
        color: var(--c-white);
      }

      .afd-pilot:focus-visible {
        outline: 2px solid var(--c-red);
        outline-offset: 3px;
      }

      .afd-pilot__avatar {
        --cut: 8px;
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        border: 1px solid var(--c-line-hot);
        background: rgba(26, 26, 30, 0.55);
        overflow: hidden;
        clip-path: var(--afd-cut);
        box-shadow: inset 0 0 0 1px rgba(209, 30, 36, 0.35);
      }

      .afd-pilot__avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .afd-pilot__meta {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        max-width: 220px;
      }

      .afd-pilot__name {
        font-family: var(--font-display);
        font-size: 1.35rem;
        letter-spacing: 0.06em;
        line-height: 1;
        color: var(--c-white);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      }

      .afd-pilot__rank {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--c-ok);
        white-space: nowrap;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      }

      .afd-xp {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }

      .afd-xp__track {
        --cut: 3px;
        height: 4px;
        min-width: 110px;
        background: rgba(14, 14, 16, 0.45);
        overflow: hidden;
        clip-path: var(--afd-cut);
        box-shadow: inset 0 0 0 1px rgba(245, 245, 247, 0.12);
      }

      .afd-xp__fill {
        height: 100%;
        width: 62%;
        background: linear-gradient(90deg, var(--c-warn), #ffb347);
        box-shadow: 0 0 10px rgba(255, 140, 30, 0.35);
      }

      .afd-xp__val {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.02em;
        color: var(--c-grey);
        white-space: nowrap;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      }

      .afd-icon-btn {
        --cut: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border: 1px solid rgba(245, 245, 247, 0.22);
        background: rgba(245, 245, 247, 0.06);
        color: var(--c-grey);
        clip-path: var(--afd-cut);
        transition: color 0.15s var(--ease), border-color 0.15s var(--ease), background 0.15s var(--ease);
      }

      .afd-icon-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .afd-icon-btn:hover {
        color: var(--c-white);
        border-color: rgba(245, 245, 247, 0.4);
        background: rgba(245, 245, 247, 0.12);
      }

      .afd-icon-btn:focus-visible {
        outline: 2px solid var(--c-red);
        outline-offset: 2px;
      }

      .afd-icon-btn[aria-pressed="true"] {
        color: var(--c-red-hot);
        border-color: rgba(209, 30, 36, 0.75);
        background: rgba(209, 30, 36, 0.12);
      }

      .afd-wallet {
        --cut: 10px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 8px 12px;
        border: 1px solid rgba(245, 245, 247, 0.22);
        background: rgba(245, 245, 247, 0.06);
        clip-path: var(--afd-cut);
      }

      .afd-header[data-skin="steel"] .afd-wallet,
      .afd-header[data-skin="steel"] .afd-icon-btn,
      .afd-header[data-skin="steel"] .afd-shop {
        background: rgba(14, 14, 16, 0.28);
        border-color: rgba(245, 245, 247, 0.28);
      }

      .afd-currency {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--c-white);
        white-space: nowrap;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      }

      .afd-currency__ico {
        display: block;
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex: 0 0 auto;
        image-rendering: auto;
      }

      .afd-plus {
        color: var(--c-warn);
      }

      .afd-plus:hover {
        color: #ffb347;
        border-color: rgba(255, 140, 30, 0.55);
      }

      .afd-shop {
        --cut: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid rgba(245, 245, 247, 0.22);
        background: rgba(245, 245, 247, 0.06);
        color: var(--c-white);
        font-family: var(--font-display);
        font-size: 1.05rem;
        letter-spacing: 0.12em;
        clip-path: var(--afd-cut);
        transition: border-color 0.15s var(--ease), background 0.15s var(--ease), color 0.15s var(--ease);
      }

      .afd-shop svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: var(--c-ok);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .afd-shop:hover {
        border-color: var(--c-red);
        background: rgba(209, 30, 36, 0.14);
      }

      .afd-shop:focus-visible {
        outline: 2px solid var(--c-red);
        outline-offset: 2px;
      }

      .afd-skin-switch {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 20;
        display: flex;
        gap: 6px;
        padding: 6px;
        background: rgba(14, 14, 16, 0.72);
        border: 1px solid var(--c-line);
        backdrop-filter: blur(8px);
      }

      .afd-skin-switch button {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 8px;
        color: var(--c-grey);
        border: 1px solid transparent;
      }

      .afd-skin-switch button.is-on {
        color: var(--c-white);
        border-color: var(--c-red);
        background: rgba(209, 30, 36, 0.18);
      }

      @media (max-width: 980px) {
        .afd-header {
          flex-direction: column;
          align-items: stretch;
        }

        .afd-header__left,
        .afd-header__right {
          justify-content: space-between;
        }

        .afd-pilot__meta {
          max-width: none;
        }
      }

      @media (max-width: 640px) {
        .afd-wallet {
          width: 100%;
          justify-content: space-between;
        }

        .afd-xp__val {
          display: none;
        }
      }

      /* —— Fase 2: mode cards — SVG do modelo azul (alta fidelidade) —— */
      .tela--menu-v2 .menu-shell {
        grid-template-columns: minmax(256px, 368px) minmax(220px, 320px);
        align-items: end;
        padding-top: 28px;
      }

      .tela--menu-v2 .menu-rail {
        display: none;
      }

      .afd-modes {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 22px;
        width: min(100%, 368px);
        padding: 4px 0 8px;
      }

      .afd-mode-wrap {
        position: relative;
        padding-top: 16px;
      }

      .afd-mode__ext {
        position: absolute;
        top: 0;
        z-index: 5;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.03em;
        line-height: 1;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
      }

      .afd-mode__ext--daily {
        left: 10px;
        color: var(--c-grey);
      }

      .afd-mode__ext--time {
        right: 4px;
        color: var(--c-warn);
      }

      /*
        Forma = card-menu-otimizado-1.svg (viewBox 1228×434).
        SVG como moldura; sem clip-path / mask PNG.
      */
      .afd-mode {
        --mode-frame: #68eab6;
        --mode-frame-muted: #a8bcb1;
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 920 / 242;
        height: auto;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--c-white);
        text-align: left;
        cursor: pointer;
      }

      .afd-mode:focus-visible {
        outline: none;
      }

      .afd-mode__svg {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        pointer-events: none;
      }

      .afd-mode__shape {
        fill: var(--mode-frame);
        fill-rule: evenodd;
        transition: fill 0.18s var(--ease);
      }

      .afd-mode__shape--muted {
        fill: var(--mode-frame-muted);
      }

      .afd-mode__media {
        position: absolute;
        /* janela interna do SVG (buraco evenodd), viewBox 150 128 920 242 */
        left: 5.5%;
        top: 8%;
        right: 3%;
        bottom: 22%;
        z-index: 0;
        overflow: hidden;
        background: rgba(4, 8, 14, 0.88);
      }

      .afd-mode__media img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 70% center;
        opacity: 0.78;
        transition: opacity 0.3s var(--ease);
      }

      .afd-mode__media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(5, 7, 12, 0.9) 0%,
          rgba(5, 7, 12, 0.55) 45%,
          rgba(5, 7, 12, 0.2) 75%,
          rgba(5, 7, 12, 0.4) 100%
        );
        pointer-events: none;
      }

      .afd-mode:hover .afd-mode__media img,
      .afd-mode:focus-visible .afd-mode__media img,
      .afd-mode.is-on .afd-mode__media img {
        opacity: 0.92;
      }

      .afd-mode:hover {
        --mode-frame: #f5f5f7;
        --mode-frame-muted: #c8d0cc;
      }

      .afd-mode.is-on {
        --mode-frame: var(--c-red-hot);
        --mode-frame-muted: #e07a76;
      }

      .afd-mode.is-on .afd-mode__media {
        background: rgba(40, 8, 10, 0.72);
      }

      .afd-mode__body {
        position: absolute;
        z-index: 4;
        left: 7%;
        right: 5%;
        top: 12%;
        height: 52%;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        padding: 0 8px 0 12px;
        gap: 6px;
        pointer-events: none;
      }

      .afd-mode__copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 7px;
        min-width: 0;
      }

      .afd-mode__kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--c-red-hot);
        line-height: 1;
      }

      .afd-mode__kicker-mark {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5px 0 5px 8px;
        border-color: transparent transparent transparent var(--c-red-hot);
        flex: 0 0 auto;
      }

      .afd-mode__title {
        font-family: var(--font-display);
        font-size: 1.72rem;
        letter-spacing: 0.05em;
        line-height: 0.92;
        text-transform: uppercase;
        color: var(--c-white);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
      }

      .afd-mode__meta {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--c-warn);
      }

      .afd-mode__art {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 0;
      }

      .afd-mode__art img {
        display: block;
        width: auto;
        height: 78%;
        max-width: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.55));
      }

      .afd-mode__art--pixel img {
        image-rendering: pixelated;
        height: 84%;
      }

      .afd-modes__more {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
        padding-left: 2px;
      }

      .afd-modes__more .btn {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }

      @media (max-width: 980px) {
        .tela--menu-v2 .menu-shell {
          grid-template-columns: 1fr;
        }

        .afd-modes {
          width: 100%;
        }
      }

      @media (max-width: 640px) {
        .afd-mode__title {
          font-size: 1.55rem;
        }

        .afd-mode__art {
          display: none;
        }

        .afd-mode__body {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="tela tela--menu tela--menu-v2">
    <div class="tela__audio" hidden aria-hidden="true">
      <audio src="../audio/ui_select.wav" preload="auto" data-afd="ui_select"></audio>
      <audio src="../audio/ui_confirm.wav" preload="auto" data-afd="ui_confirm"></audio>
      <audio src="../audio/ui_toggle.wav" preload="auto" data-afd="ui_toggle"></audio>
      <audio src="../audio/ui_deny.wav" preload="auto" data-afd="ui_deny"></audio>
      <audio src="../audio/ui_arm.wav" preload="auto" data-afd="ui_arm"></audio>
      <audio src="../audio/menu_theme.wav" preload="auto" data-afd="menu_theme"></audio>
    </div>

    <div class="tela__bg" aria-hidden="true">
      <img
        class="tela__bg-img"
        src="../../assets/ui/title_bg.jpg"
        alt=""
        decoding="async"
      />
      <div class="tela__bg-veil"></div>
      <div class="tela__bg-grain"></div>
    </div>

    <!-- Fase 1: header hub (perfil · patente · wallet · loja) -->
    <header class="afd-header" data-skin="glass" aria-label="Barra do piloto">
      <span class="afd-header__bracket afd-header__bracket--tl" aria-hidden="true"></span>
      <span class="afd-header__bracket afd-header__bracket--tr" aria-hidden="true"></span>
      <span class="afd-header__bracket afd-header__bracket--bl" aria-hidden="true"></span>
      <span class="afd-header__bracket afd-header__bracket--br" aria-hidden="true"></span>

      <div class="afd-header__left">
        <button
          type="button"
          class="afd-pilot glitch-el"
          data-sfx="select"
          data-nav="profile"
          aria-label="Abrir perfil de VIPER-1"
        >
          <span class="afd-pilot__avatar" aria-hidden="true">
            <img
              src="../../assets/ui/avatars/avatar_01.png"
              alt=""
              width="48"
              height="48"
              decoding="async"
            />
          </span>
          <span class="afd-pilot__meta">
            <span class="afd-pilot__name">VIPER-1</span>
            <span class="afd-pilot__rank">Capitão · Lv 14</span>
            <span class="afd-xp" aria-label="Progresso de patente 12400 de 20000 XP">
              <span class="afd-xp__track">
                <span class="afd-xp__fill"></span>
              </span>
              <span class="afd-xp__val">12.4k / 20k</span>
            </span>
          </span>
        </button>

        <button
          type="button"
          class="afd-icon-btn glitch-el"
          data-sfx="select"
          data-nav="config"
          title="Configurações"
          aria-label="Configurações"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"
            ></path>
          </svg>
        </button>
      </div>

      <div class="afd-header__right">
        <div class="afd-wallet glitch-el" aria-label="Carteira">
          <span class="afd-currency afd-currency--cr" title="Credits">
            <img
              class="afd-currency__ico"
              src="../../apps/web/public/ui/currency/icon_cr.png"
              alt=""
              width="20"
              height="20"
              decoding="async"
              draggable="false"
            />
            <span>12.450</span>
          </span>
          <span class="afd-currency afd-currency--dc" title="Dashi Coins">
            <img
              class="afd-currency__ico"
              src="../../apps/web/public/ui/currency/icon_dc.png"
              alt=""
              width="20"
              height="20"
              decoding="async"
              draggable="false"
            />
            <span>80</span>
          </span>
        </div>

        <button
          type="button"
          class="afd-icon-btn afd-plus glitch-el"
          data-sfx="confirm"
          data-nav="shop"
          title="Recarregar"
          aria-label="Recarregar créditos"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>

        <button
          type="button"
          class="afd-shop glitch-el"
          data-sfx="confirm"
          data-nav="shop"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="20" r="1.4"></circle>
            <circle cx="18" cy="20" r="1.4"></circle>

      (function () {
        var header = document.querySelector(".afd-header");
        var picks = document.querySelectorAll("[data-skin-pick]");
        if (!header || !picks.length) return;
        picks.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var skin = btn.getAttribute("data-skin-pick");
            header.setAttribute("data-skin", skin);

            });
          });
        });
