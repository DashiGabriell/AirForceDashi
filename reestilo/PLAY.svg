<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Play">
  <title>Play</title>
  <defs>
    <linearGradient id="playFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f22e29"/>
      <stop offset="48%" stop-color="#d11e24"/>
      <stop offset="100%" stop-color="#a81418"/>
    </linearGradient>
    <linearGradient id="playEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a7a" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6e0c10" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="badgeFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8252a"/>
      <stop offset="100%" stop-color="#b8161b"/>
    </linearGradient>
  </defs>

  <!-- Depth plate -->
  <path
    d="M118 52H660L692 84V164H118V52Z"
    fill="#4a080b"
    opacity="0.5"
    transform="translate(5 7)"
  />

  <!-- Brand badge -->
  <g id="badge">
    <path d="M28 40H118V160H52L28 136V40Z" fill="url(#badgeFace)"/>
    <path d="M28 40H118V160H52L28 136V40Z" stroke="url(#playEdge)" stroke-width="1.75"/>
    <path d="M38 50H56M38 50V68" stroke="#f5f5f7" stroke-width="2.25" stroke-linecap="square" opacity="0.9"/>
    <path d="M108 148H90M108 148V130" stroke="#f5f5f7" stroke-width="2" stroke-linecap="square" opacity="0.5"/>
    <!-- XA mark -->
    <g stroke="#f5f5f7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 70L70 92M70 70L48 92"/>
      <path d="M78 118L90 82L102 118M82.5 106H97.5"/>
    </g>
  </g>

  <!-- Main chassis — cut bottom-right (AFD DS) -->
  <g id="chassis">
    <path d="M110 46H688V128L656 160H110V46Z" fill="url(#playFace)"/>
    <path d="M110 46H688V50H114L110 46Z" fill="#ffffff" opacity="0.18"/>
    <path
      d="M124 60H672V120L652 148H124V60Z"
      fill="none"
      stroke="#f5f5f7"
      stroke-width="1.35"
      opacity="0.2"
    />
    <path d="M110 46H688V128L656 160H110V46Z" stroke="url(#playEdge)" stroke-width="2.25"/>
    <path d="M124 60H152M124 60V88" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="square" opacity="0.92"/>
    <path d="M652 148H624M652 148V120" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="square" opacity="0.78"/>
  </g>

  <!-- Right end tab -->
  <g id="end-tab">
    <path d="M668 78H704L716 90V122L704 134H668V78Z" fill="#c0181d"/>
    <path d="M668 78H704L716 90V122L704 134H668V78Z" stroke="url(#playEdge)" stroke-width="1.5"/>
    <path d="M684 94H700M684 106H700M684 118H694" stroke="#f5f5f7" stroke-width="2.1" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- PLAY — condensed outline lettering -->
  <g
    id="label"
    fill="none"
    stroke="#f5f5f7"
    stroke-width="9"
    stroke-linecap="square"
    stroke-linejoin="miter"
    transform="translate(188 72)"
  >
    <path d="M0 78V0H46C70 0 84 14 84 36C84 58 70 72 46 72H0"/>
    <path d="M116 0V78H186"/>
    <path d="M210 78L258 0L306 78M226 50H290"/>
    <path d="M330 0L378 40L426 0M378 40V78"/>
  </g>
</svg>
